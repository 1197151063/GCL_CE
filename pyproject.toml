[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rrec-sampling-experiments"
version = "0.1.0"
description = "Controlled SGL sampling experiments for graph recommendation"
requires-python = ">=3.8"
dependencies = ["torch>=1.13,<3", "numpy>=1.21,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<8.4"]

[tool.setuptools.packages.find]
include = ["rrec_experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
